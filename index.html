<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تكسي</title>
<style>
  :root{--p:#6B3FE8;--p2:#8A63F5;--pl:#F1ECFF;--ink:#171A24;--muted:#7C8193;--bg:#F5F6FA;--line:#ECEEF4;--green:#17B26A;--y:#FFB800}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#d9dce6;color:var(--ink);display:flex;justify-content:center}
  .app{width:100%;max-width:430px;height:100vh;max-height:900px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .map{position:absolute;inset:0 0 40% 0;background:#e8ecf3;overflow:hidden}
  .map svg{width:100%;height:100%}
  .me{position:absolute;top:44%;left:50%;width:20px;height:20px;border-radius:50%;background:var(--p);border:4px solid #fff;
    transform:translate(-50%,-50%);box-shadow:0 0 0 10px rgba(107,63,232,.2);animation:pl 2s infinite}
  @keyframes pl{50%{box-shadow:0 0 0 18px rgba(107,63,232,.08)}}
  .car{position:absolute;font-size:20px}

  .head{position:absolute;top:0;inset-inline:0;padding:max(14px,env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .chip{background:#fff;border-radius:22px;padding:9px 14px;font-size:13.5px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.1);display:flex;gap:6px;align-items:center}
  .round{width:42px;height:42px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.1);font-size:17px;cursor:pointer}

  .sheet{position:absolute;bottom:64px;inset-inline:0;background:#fff;border-radius:26px 26px 0 0;padding:10px 16px 14px;box-shadow:0 -8px 30px rgba(0,0,0,.1);z-index:6;
    max-height:calc(100% - 140px);overflow:auto}
  .grab{width:42px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 12px}

  .search{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:14px;cursor:pointer;width:100%;border:0;font:inherit;text-align:start}
  .search .dot{width:10px;height:10px;border-radius:50%;background:var(--p)}
  .search span{color:var(--muted);font-size:15px;flex:1}
  .search b{background:#fff;border-radius:10px;padding:5px 10px;font-size:12px;color:var(--p)}

  .saved{display:flex;gap:10px;margin:12px 0 14px;overflow-x:auto;scrollbar-width:none}
  .saved button{flex:none;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 13px;font:inherit;font-size:13.5px;cursor:pointer}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .svc{background:var(--pl);border:0;border-radius:18px;padding:14px 4px 10px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;transition:.15s}
  .svc:active{transform:scale(.96)}
  .svc em{font-size:28px;font-style:normal}
  .svc span{font-size:12.5px;font-weight:700}
  .svc i{position:absolute;top:-6px;inset-inline-end:6px;background:var(--y);font-style:normal;font-size:10px;font-weight:800;padding:2px 7px;border-radius:9px}

  .promo{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative}
  .promo h3{font-size:16px;margin-bottom:4px}.promo p{font-size:12.5px;opacity:.9}
  .promo .em{font-size:46px;transform:rotate(-8deg)}
  .promo button{margin-top:10px;background:#fff;color:var(--p);border:0;border-radius:10px;padding:7px 14px;font:inherit;font-weight:800;font-size:12.5px}

  .nav{position:absolute;bottom:0;inset-inline:0;height:64px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:7;padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
  .nav button em{font-style:normal;font-size:21px}
  .nav button.on{color:var(--p);font-weight:800}

  /* ride screen */
  .ride{position:absolute;inset:0;background:var(--bg);z-index:20;transform:translateY(100%);transition:transform .35s ease;display:flex;flex-direction:column}
  .ride.open{transform:none}
  .rtop{background:#fff;padding:max(14px,env(safe-area-inset-top)) 16px 14px;border-radius:0 0 24px 24px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
  .rtop .bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .rtop .bar b{font-size:17px}
  .rt{background:var(--bg);border-radius:16px;padding:4px 14px}
  .rt div{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14.5px}
  .rt div+div{border-top:1px dashed var(--line)}
  .rt i{width:11px;height:11px;border-radius:50%;background:var(--green)}.rt div:last-child i{background:var(--ink);border-radius:3px}
  .list{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid transparent;border-radius:18px;padding:13px;cursor:pointer;font:inherit;text-align:start;width:100%}
  .opt.sel{border-color:var(--p);background:#FAF8FF}
  .opt em{font-size:32px;font-style:normal}.opt .t{flex:1}.opt .t b{display:block;font-size:15px}.opt .t small{color:var(--muted);font-size:12px}
  .opt .pr{font-weight:800;font-size:16px}
  .rbot{background:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
  .pay{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:12px}.pay b{color:var(--ink)}
  .cta{width:100%;border:0;background:var(--p);color:#fff;font:inherit;font-weight:800;font-size:17px;padding:16px;border-radius:16px;cursor:pointer;box-shadow:0 8px 20px rgba(107,63,232,.35)}
  .cta:active{transform:scale(.98)}
  .toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">

  <div class="map">
    <svg viewBox="0 0 430 540" preserveAspectRatio="xMidYMid slice">
      <rect width="430" height="540" fill="#e8ecf3"/>
      <path d="M-10 430 Q130 380 230 430 T450 400 L450 540 L-10 540Z" fill="#cde4f5"/>
      <g fill="#d8eed0"><rect x="24" y="70" width="110" height="70" rx="16"/><rect x="300" y="250" width="110" height="80" rx="16"/></g>
      <g stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round">
        <path d="M-10 170 L440 215"/><path d="M-10 330 L440 295"/><path d="M110 -10 L160 450"/><path d="M320 -10 L290 450"/>
      </g>
    </svg>
    <div class="me"></div>
    <span class="car" style="top:30%;left:20%">🚕</span><span class="car" style="top:56%;left:68%">🚕</span>
    <span class="car" style="top:22%;left:74%">🚕</span><span class="car" style="top:62%;left:30%">🚕</span>
  </div>

  <div class="head">
    <button class="round">☰</button>
    <div class="chip">📍 الكرادة، بغداد</div>
    <button class="round">🔔</button>
  </div>

  <div class="sheet">
    <div class="grab"></div>
    <button class="search" onclick="openRide()"><i class="dot"></i><span>إلى أين تريد الذهاب؟</span><b>الآن ⏱</b></button>

    <div class="saved">
      <button onclick="openRide('البيت')">🏠 البيت</button>
      <button onclick="openRide('العمل')">💼 العمل</button>
      <button onclick="openRide('المطار')">✈️ المطار</button>
      <button onclick="openRide('الجامعة')">🎓 الجامعة</button>
    </div>

    <div class="grid">
      <button class="svc" onclick="openRide()"><em>🚕</em><span>تكسي</span></button>
      <button class="svc" onclick="openRide()"><i>جديد</i><em>🛵</em><span>سكوتر</span></button>
      <button class="svc" onclick="openRide()"><em>🚺</em><span>للنساء</span></button>
      <button class="svc" onclick="toast('خدمة التوصيل قريباً')"><em>📦</em><span>توصيل</span></button>
    </div>

    <div class="promo">
      <div><h3>أول 3 رحلات بخصم 30%</h3><p>استخدم كود الدعوة عند الطلب</p><button>انسخ الكود: TAXI30</button></div>
      <div class="em">🎁</div>
    </div>
  </div>

  <nav class="nav">
    <button class="on"><em>🏠</em>الرئيسية</button>
    <button onclick="toast('رحلاتي')"><em>🧾</em>رحلاتي</button>
    <button onclick="toast('العروض')"><em>🏷️</em>العروض</button>
    <button onclick="toast('الحساب')"><em>👤</em>حسابي</button>
  </nav>

  <!-- Ride screen -->
  <div class="ride" id="ride">
    <div class="rtop">
      <div class="bar"><button class="round" onclick="closeRide()" style="box-shadow:none;background:var(--bg)">→</button><b>اختر رحلتك</b></div>
      <div class="rt"><div><i></i>موقعي الحالي</div><div><i></i><span id="destTxt">مجمع بغداد التجاري</span></div></div>
    </div>
    <div class="list" id="list">
      <button class="opt sel" data-n="اقتصادي" data-p="4,500"><em>🚕</em><span class="t"><b>اقتصادي</b><small>4 ركاب · 3 دقائق</small></span><span class="pr">4,500</span></button>
      <button class="opt" data-n="مريح" data-p="6,500"><em>🚙</em><span class="t"><b>مريح</b><small>سيارة حديثة مكيّفة · 5 دقائق</small></span><span class="pr">6,500</span></button>
      <button class="opt" data-n="عائلي" data-p="9,000"><em>🚐</em><span class="t"><b>عائلي</b><small>حتى 7 ركاب · 7 دقائق</small></span><span class="pr">9,000</span></button>
      <button class="opt" data-n="للنساء" data-p="6,000"><em>🚺</em><span class="t"><b>للنساء</b><small>سائقات فقط · 8 دقائق</small></span><span class="pr">6,000</span></button>
    </div>
    <div class="rbot">
      <div class="pay"><span>الدفع</span><b>💵 نقداً ‹</b></div>
      <button class="cta" id="go">تأكيد الطلب · اقتصادي</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  const $=id=>document.getElementById(id);
  let sel='اقتصادي';
  function openRide(place){ if(place) $('destTxt').textContent=place; $('ride').classList.add('open'); }
  function closeRide(){ $('ride').classList.remove('open'); }
  function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800);}
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');
    sel=o.dataset.n;$('go').textContent='تأكيد الطلب · '+sel;
  });
  $('go').onclick=()=>{toast('جارٍ البحث عن سائق…');setTimeout(closeRide,900);};
</script>
</body>
</html>
